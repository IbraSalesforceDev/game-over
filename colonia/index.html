<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101418" />
    <meta name="description" content="Colonia Óxido: colonos, fábricas y un planeta lleno de criaturas que odian la contaminación." />
    <title>Colonia Óxido</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23101418'/%3E%3Ccircle cx='16' cy='16' r='9' fill='%23aab4bf'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%23101418'/%3E%3Crect x='14' y='3' width='4' height='6' fill='%23aab4bf'/%3E%3Crect x='14' y='23' width='4' height='6' fill='%23aab4bf'/%3E%3Crect x='3' y='14' width='6' height='4' fill='%23aab4bf'/%3E%3Crect x='23' y='14' width='6' height='4' fill='%23aab4bf'/%3E%3C/svg%3E"
    />
    <style>
      :root {
        --fondo: #101418;
        --panel: rgba(18, 22, 28, 0.94);
        --panel2: #1c232c;
        --borde: #2f3a46;
        --texto: #e4e8ee;
        --tenue: #8794a4;
        --acento: #d9772b;
        --acento2: #f0a050;
        --bien: #6fd06f;
        --mal: #e05040;
        --aviso: #f0c040;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--fondo);
        color: var(--texto);
        font: 13px/1.4 ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
        user-select: none;
      }
      #lienzo {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      button {
        font: inherit;
        color: var(--texto);
        background: var(--panel2);
        border: 1px solid var(--borde);
        border-radius: 4px;
        padding: 5px 10px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      button:hover:not(:disabled) {
        border-color: var(--acento);
      }
      button:focus-visible {
        outline: 2px solid var(--acento2);
        outline-offset: 1px;
      }
      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      button.activa {
        border-color: var(--acento);
        background: #3a2a1c;
        color: var(--acento2);
      }
      button.primario {
        background: var(--acento);
        border-color: var(--acento);
        color: #120c06;
        font-weight: 700;
      }
      button.peligro {
        color: #ffb0a6;
        border-color: #6a2a24;
      }
      button.pequeno {
        padding: 2px 7px;
        font-size: 12px;
      }
      .icono-boton {
        background: transparent;
        border-color: transparent;
      }
      .sub {
        color: var(--tenue);
        font-size: 12px;
      }
      .ok {
        color: var(--bien);
      }
      .aviso {
        color: var(--aviso);
      }
      .icono {
        image-rendering: auto;
        vertical-align: middle;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 3px;
        padding: 1px 6px;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.06);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .chip.rojo {
        color: #ffb0a6;
        background: rgba(224, 80, 64, 0.2);
      }
      .coste {
        display: inline-flex;
        gap: 3px;
        flex-wrap: wrap;
      }
      .barra {
        height: 6px;
        background: rgba(0, 0, 0, 0.5);
        border-radius: 3px;
        overflow: hidden;
        flex: 1;
        min-width: 40px;
      }
      .barra > div {
        height: 100%;
      }
      .fila {
        display: flex;
        gap: 6px;
        align-items: center;
        margin-top: 8px;
      }
      .fila.envolver {
        flex-wrap: wrap;
      }
      h3 {
        font-size: 14px;
        margin-bottom: 4px;
        display: flex;
        gap: 8px;
        align-items: center;
      }

      /* --- Barra superior --- */
      .arriba {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 6px 10px;
        background: var(--panel);
        border-bottom: 1px solid var(--borde);
        z-index: 5;
        flex-wrap: wrap;
      }
      .reloj {
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        min-width: 130px;
      }
      .velocidades {
        display: flex;
        gap: 2px;
      }
      .velocidades button {
        padding: 3px 8px;
        font-size: 11px;
      }
      .recursos {
        display: flex;
        gap: 4px;
        flex-wrap: wrap;
        flex: 1;
      }
      .estado {
        display: flex;
        gap: 4px;
        flex-wrap: wrap;
      }
      .botones {
        display: flex;
        gap: 4px;
      }

      /* --- Colonos --- */
      .colonos {
        position: fixed;
        top: 52px;
        left: 8px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        z-index: 4;
        width: 170px;
        max-height: calc(100vh - 140px);
        overflow-y: auto;
      }
      .tarjeta {
        display: block;
        text-align: left;
        background: var(--panel);
        padding: 5px 8px;
        width: 100%;
      }
      .tarjeta.reclutado {
        border-color: #a03a2a;
      }
      .tarjeta-nombre {
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .punto {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        display: inline-block;
      }
      .tarjeta-estado {
        color: var(--tenue);
        font-size: 11px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .mini {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 3px;
        margin-top: 3px;
      }
      .mini .barra {
        height: 4px;
        min-width: 0;
      }

      /* --- Herramientas --- */
      .abajo {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        display: flex;
        gap: 3px;
        padding: 6px;
        background: var(--panel);
        border-top: 1px solid var(--borde);
        z-index: 5;
        flex-wrap: wrap;
        justify-content: center;
      }
      .submenu {
        position: fixed;
        bottom: 44px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 4px;
        padding: 6px;
        background: var(--panel);
        border: 1px solid var(--borde);
        border-radius: 6px;
        z-index: 5;
        flex-wrap: wrap;
        justify-content: center;
        max-width: calc(100vw - 20px);
      }
      .submenu[hidden] {
        display: none;
      }
      .submenu button {
        flex-direction: column;
        align-items: flex-start;
        gap: 2px;
      }
      .pista {
        position: fixed;
        top: 50px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.7);
        padding: 4px 12px;
        border-radius: 12px;
        z-index: 4;
        pointer-events: none;
        font-size: 12px;
      }
      .pista[hidden] {
        display: none;
      }

      /* --- Inspector --- */
      .inspector {
        position: fixed;
        right: 8px;
        bottom: 56px;
        width: 290px;
        max-height: calc(100vh - 130px);
        overflow-y: auto;
        background: var(--panel);
        border: 1px solid var(--borde);
        border-radius: 6px;
        padding: 10px;
        z-index: 4;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .inspector[hidden] {
        display: none;
      }
      .linea {
        display: flex;
        gap: 6px;
        align-items: center;
        flex-wrap: wrap;
      }
      .linea > .sub:first-child {
        min-width: 70px;
      }
      .habilidades {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 2px 10px;
        margin-top: 6px;
      }
      .habilidades div {
        display: flex;
        justify-content: space-between;
      }
      .recuerdos {
        margin-top: 6px;
        font-size: 12px;
      }
      .orden {
        display: flex;
        gap: 5px;
        align-items: center;
      }
      .orden-nombre {
        flex: 1;
        display: flex;
        gap: 4px;
        align-items: center;
      }

      /* --- Avisos --- */
      .avisos {
        position: fixed;
        top: 52px;
        right: 8px;
        display: flex;
        flex-direction: column;
        gap: 3px;
        z-index: 3;
        width: 320px;
      }
      .avisos > div {
        background: var(--panel);
        border-left: 3px solid var(--tenue);
        padding: 4px 8px;
        font-size: 12px;
        border-radius: 3px;
        cursor: pointer;
      }
      .aviso-bien {
        border-left-color: var(--bien) !important;
      }
      .aviso-aviso {
        border-left-color: var(--aviso) !important;
      }
      .aviso-peligro {
        border-left-color: var(--mal) !important;
        color: #ffcfc8;
      }

      /* --- Ventanas --- */
      .capa-modal {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.55);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 50;
        padding: 16px;
      }
      .modal {
        background: #151a20;
        border: 1px solid var(--borde);
        border-radius: 8px;
        width: 100%;
        max-height: calc(100vh - 32px);
        display: flex;
        flex-direction: column;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
      }
      .modal-cabecera {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 14px;
        border-bottom: 1px solid var(--borde);
      }
      .modal-cabecera h2 {
        font-size: 16px;
        color: var(--acento2);
      }
      .modal-cuerpo {
        padding: 14px;
        overflow: auto;
      }
      .modal-cuerpo h3 {
        margin-top: 12px;
        color: var(--acento2);
      }
      .modal-cuerpo p,
      .modal-cuerpo ol {
        margin-bottom: 6px;
      }
      .modal-cuerpo ol {
        padding-left: 20px;
      }
      .nota {
        color: var(--tenue);
        margin-bottom: 10px;
      }
      .tecnologias {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 8px;
      }
      .tec {
        border: 1px solid var(--borde);
        border-radius: 6px;
        padding: 8px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        background: var(--panel2);
      }
      .tec.hecha {
        border-color: #2f6a3a;
      }
      .tec.disponible {
        border-color: var(--acento);
      }
      .tec.bloqueada {
        opacity: 0.55;
      }
      .tec.actual {
        box-shadow: 0 0 0 2px var(--acento2) inset;
      }
      .tec-nombre {
        font-weight: 700;
      }
      .tec-coste {
        display: flex;
        gap: 6px;
        align-items: center;
        flex-wrap: wrap;
      }
      .actual {
        margin-bottom: 10px;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .prioridades {
        border-collapse: collapse;
        width: 100%;
      }
      .prioridades th {
        font-weight: normal;
        color: var(--tenue);
        font-size: 11px;
        padding: 4px;
      }
      .prioridades th.nombre {
        text-align: left;
        color: var(--texto);
        font-size: 13px;
      }
      .prioridades td {
        padding: 2px;
        text-align: center;
      }
      .prio {
        width: 100%;
        justify-content: center;
        font-weight: 700;
        min-height: 30px;
      }
      .prio .hab {
        font-weight: normal;
        color: var(--tenue);
        font-size: 10px;
      }
      .prio.p1 {
        background: #4a2a14;
        color: #ffb070;
      }
      .prio.p2 {
        background: #3a2e1c;
        color: #f0c890;
      }
      .prio.p0 {
        opacity: 0.5;
      }
      .controles td {
        padding: 2px 10px 2px 0;
      }
      kbd {
        background: var(--panel2);
        border: 1px solid var(--borde);
        border-radius: 3px;
        padding: 0 5px;
        font-family: ui-monospace, monospace;
        font-size: 12px;
      }
      @media (max-width: 760px) {
        .colonos {
          width: 130px;
        }
        .avisos {
          width: 220px;
        }
        .inspector {
          width: calc(100vw - 16px);
        }
      }
    </style>
  </head>
  <body>
    <canvas id="lienzo"></canvas>
    <div id="cargador" style="position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: #8794a4">Cargando…</div>
    <script type="module" src="/src/colonia/main.ts"></script>
  </body>
</html>
