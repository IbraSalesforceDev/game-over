<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0d1117" />
    <meta name="description" content="Juego sandbox 2D de tiles: cava, construye, sobrevive." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Icono en línea: evita una petición de red y el 404 en las capturas. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%23121a12'/%3E%3Crect x='4' y='16' width='24' height='12' fill='%236b4b2a'/%3E%3Crect x='4' y='16' width='24' height='3' fill='%234c8b3a'/%3E%3Crect x='9' y='6' width='6' height='9' fill='%23d8cfc0'/%3E%3C/svg%3E"
    />
    <title>Game Over — sandbox 2D</title>
    <style>
      :root {
        --cielo-alto: #3b6ea5;
        --cielo-bajo: #8fc0e8;
        --tierra: #6b4b2a;
        --piedra: #6e6e78;
        --hierba: #4c8b3a;
        --tinta: #0d1117;
        --hueso: #d8cfc0;
        --ambar: #e8b64c;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--tinta);
        color: var(--hueso);
        font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        overscroll-behavior: none;
        touch-action: none;
      }
      #lienzo {
        display: block;
        width: 100%;
        height: 100%;
        image-rendering: pixelated;
        touch-action: none;
      }
      #capa-ui {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 10;
      }

      /* --- Pantalla de carga --- */
      #cargador {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.6rem;
        background: radial-gradient(ellipse at 50% 45%, #1b2430 0%, #0d1117 70%), #0d1117;
        transition: opacity 0.5s ease-out;
      }
      #cargador.oculto {
        opacity: 0;
        pointer-events: none;
      }
      #titulo-carga {
        font-size: clamp(1.6rem, 6vw, 3rem);
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--ambar);
        text-shadow: 0 0 22px rgba(232, 182, 76, 0.3), 0 3px 0 #000;
      }
      #subtitulo-carga {
        font-size: clamp(0.65rem, 2.4vw, 0.85rem);
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: #6d7a8a;
      }
      #barra-marco {
        width: min(70vw, 420px);
        height: 16px;
        border: 2px solid #38434f;
        background: #131a22;
        box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.8);
        overflow: hidden;
      }
      #barra-relleno {
        width: 0%;
        height: 100%;
        background: linear-gradient(180deg, #f0cf7a 0%, #d29c30 50%, #8f6416 100%);
        transition: width 0.2s ease-out;
      }
      #texto-carga {
        font-size: 0.75rem;
        letter-spacing: 0.1em;
        color: #6d7a8a;
        min-height: 1.2em;
      }

      /* --- Panel de error --- */
      #aviso-error {
        position: fixed;
        inset: 0;
        z-index: 200;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        padding: 2rem;
        text-align: center;
        background: #0d1117;
      }
      #aviso-error h1 {
        color: #c0483a;
        font-size: 1.3rem;
        letter-spacing: 0.08em;
      }
      #aviso-error p {
        max-width: 40rem;
        line-height: 1.6;
        color: #8b98a8;
        font-size: 0.85rem;
      }
      #detalle-error {
        max-width: 90vw;
        max-height: 40vh;
        overflow: auto;
        padding: 1rem;
        background: #131a22;
        border: 1px solid #2a343f;
        color: #9fb0c0;
        font-size: 0.7rem;
        text-align: left;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <canvas id="lienzo"></canvas>
    <div id="capa-ui" aria-live="polite"></div>

    <div id="cargador">
      <div id="titulo-carga">Game Over</div>
      <div id="subtitulo-carga">Cava · construye · sobrevive</div>
      <div id="barra-marco"><div id="barra-relleno"></div></div>
      <div id="texto-carga">Preparando el terreno&hellip;</div>
    </div>

    <div id="aviso-error">
      <h1>El mundo no ha podido cargarse</h1>
      <p>
        Algo ha fallado al arrancar el juego. Necesitas un navegador reciente con soporte de
        canvas 2D. Prueba con Chrome, Firefox o Safari actualizados.
      </p>
      <pre id="detalle-error"></pre>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
